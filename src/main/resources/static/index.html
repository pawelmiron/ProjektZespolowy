<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTCUSDT Candles Live</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main class="container">
    <h1>BTCUSDT — świeczki 1m (Binance)</h1>

    <section class="controls">
        <label for="hoursInput">Zakres historii (godziny):</label>
        <input id="hoursInput" type="number" min="1" max="240" value="6" />
        <button id="applyBtn">Pobierz historię</button>
        <span id="status" class="status">Gotowe</span>
    </section>

    <section id="chart" class="chart"></section>
</main>

<script src="app.js"></script>
</body>
</html>
